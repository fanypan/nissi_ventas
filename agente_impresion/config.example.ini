[server]
# Solo localhost. El agente rechaza otro bind.
host = 127.0.0.1
port = 4171

[printer]
# Windows: vacío = predeterminada de la sesión.
# Linux/macOS (CUPS): vacío = lpstat -d; si no hay default, poné el nombre de lpstat -a.
# Listar: python print_agent.py --list-printers
name =
width_mm = 80
# auto = ESC/POS raster si CUPS usa "Raw Printer" (tickets USB); false = PNG/PDF filtrado
escpos = auto
